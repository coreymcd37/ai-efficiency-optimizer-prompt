name: Docs check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress "**/*.md"
          fail: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate evals
        run: python scripts/validate_evals.py
      - name: Test cost estimate script
        run: python scripts/cost_estimate.py --items 100 --input-tokens 500 --output-tokens 100 --input-price 1 --output-price 2 --per 1000000
